name: Perbarui data

on:
  schedule:
    # Tiap 2 jam (waktu UTC). GitHub kadang menunda jadwal beberapa menit.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: perbarui-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang paket
        run: pip install -r requirements.txt

      - name: Unduh batas kabupaten/kota (hanya bila belum ada)
        if: hashFiles('boundaries/kabupaten.geojson') == ''
        run: python -m pipeline.fetch_boundaries || echo "::warning::Batas kabupaten gagal diunduh; level kabupaten dilewati"

      - name: Tarik & olah data
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: python -m pipeline.update

      - name: Simpan arsip ke repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive boundaries
          if git diff --cached --quiet; then
            echo "Arsip tidak berubah"
          else
            git commit -m "Arsip data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi

      - name: Susun situs
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r data/live _site/data/live
          cp -r data/archive _site/data/archive
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
